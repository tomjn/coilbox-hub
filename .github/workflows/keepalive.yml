name: Keep awake

# A Supabase project on the free tier pauses after about a week with no API
# requests, and a paused project serves nothing with no error explaining why.
# Real traffic prevents it, so this only matters during quiet stretches, which is
# exactly when nobody is watching.
#
# It reads one row straight from the database's API, so it keeps the project
# awake whatever state the website is in. It used to read the website's export,
# which stopped working when Vercel disabled the old deployment. The URL and the
# publishable key are public: the hub hands both to the desktop app at
# /api/v1/auth.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  SUPABASE_URL: https://twptlkjgdvjhpywdoajf.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_r8s0FXC86RB97wEGxRvBWA_lGoC_veZ

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one gallery item
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/item?select=id&limit=1" -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "item read returned $code"
          test "$code" = "200"
