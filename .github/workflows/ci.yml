name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The vendor drift check is the reason this runs on a schedule. Coilbox can
    # change the format or the generator without anything here being touched,
    # and the failure it causes is silent, so the check has to run even when
    # nobody has pushed.
    - cron: "0 7 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:vendor
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  database:
    # Separate from the frontend checks because it stands up a full Postgres, and
    # separate from nothing else: an access policy that is wrong fails silently,
    # so these have to run on every change rather than when somebody remembers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
