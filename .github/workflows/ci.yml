name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The vendor drift check is the reason this runs on a schedule. Coilbox can
    # change the format or the generator without anything here being touched,
    # and the failure it causes is silent, so the check has to run even when
    # nobody has pushed.
    - cron: "0 7 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:vendor
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  database:
    # Separate from the frontend checks because it stands up a full Postgres, and
    # separate from nothing else: an access policy that is wrong fails silently,
    # so these have to run on every change rather than when somebody remembers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  migrate:
    # Applies pending migrations to the production database after a merge. Vercel
    # deploys main on its own and this job cannot block it, so the point is that
    # the schema follows the code without anyone running a command.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, database]
    runs-on: ubuntu-latest
    # Add required reviewers to the production environment in the repository
    # settings to hold the job for approval before it writes.
    environment: production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the secrets are set
        id: secrets
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            message="Migrations were not applied. Add these secrets to the production environment or the repository:$missing"
            echo "::warning::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.configured == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - if: steps.secrets.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show pending migrations
        if: steps.secrets.outputs.configured == 'true'
        run: |
          supabase db push --dry-run 2>&1 | tee dry-run.txt
          {
            echo "### Pending migrations (dry run)"
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply migrations
        if: steps.secrets.outputs.configured == 'true'
        run: supabase db push
