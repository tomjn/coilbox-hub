name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The vendor drift check is the reason this runs on a schedule. Coilbox can
    # change the format or the generator without anything here being touched,
    # and the failure it causes is silent, so the check has to run even when
    # nobody has pushed.
    - cron: "0 7 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:vendor
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  database:
    # Separate from the frontend checks because it stands up a full Postgres, and
    # separate from nothing else: an access policy that is wrong fails silently,
    # so these have to run on every change rather than when somebody remembers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  php:
    # The PHP hub's tests, run against the same MariaDB version as the droplet,
    # after running its migrations there the way a deploy does.
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: hub
          MARIADB_USER: hub
          MARIADB_PASSWORD: hub
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-retries 30
    env:
      # Real environment variables, so they win over phpunit.xml's SQLite.
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hub
      DB_USERNAME: hub
      DB_PASSWORD: hub
    defaults:
      run:
        working-directory: hub-php
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql
          tools: composer
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
      - run: composer install --no-interaction --prefer-dist
      - run: cp deploy/env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan test

  migrate:
    # Applies pending migrations to the production database after a merge. Vercel
    # deploys main on its own and this job cannot block it, so the point is that
    # the schema follows the code without anyone running a command.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, database]
    runs-on: ubuntu-latest
    # Add required reviewers to the production environment in the repository
    # settings to hold the job for approval before it writes.
    environment: production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the secrets are set
        id: secrets
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            message="Migrations were not applied. Add these secrets to the production environment or the repository:$missing"
            echo "::warning::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.configured == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - if: steps.secrets.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show pending migrations
        if: steps.secrets.outputs.configured == 'true'
        run: |
          supabase db push --dry-run 2>&1 | tee dry-run.txt
          {
            echo "### Pending migrations (dry run)"
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply migrations
        if: steps.secrets.outputs.configured == 'true'
        run: supabase db push
