# The hub's Nginx site. Install as /etc/nginx/sites-available/hub.coilbox.org
# and link it into sites-enabled.
#
# On this droplet Nginx serves HTTPS only. Apache holds port 80, so the
# certificate comes from certbot's webroot mode through Apache's document root
# (see deploy/README.md).
#
# It does not include /etc/nginx/nginx-tomjn-common.conf. That file adds
# `Access-Control-Allow-Origin: *` to every response, and the hub's API sends
# its own. Two of that header and browsers refuse the response.

server {
    # No http2. On Nginx 1.24 it is an option of the whole port 443 address,
    # which the tomjn.com site shares, so turning it on here would change that
    # site too.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hub.coilbox.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/hub.coilbox.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.coilbox.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /srv/www/hub.coilbox.org/htdocs;
    index index.php;
    charset utf-8;

    # The desktop app uploads pictures up to 2 MiB in a multipart body.
    # Vercel's 4.5 MB request limit used to be the backstop, so keep one here.
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/atom+xml application/xml;

    # Hashed build files and fonts never change under the same name.
    location ~ ^/(build|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header in a location replaces the server's list, so repeat them.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # PHP's default 2M upload limit is the same as the largest picture the
        # desktop app may send, plus multipart overhead would push it over.
        # Raised for this site only, not the pool tomjn.com shares.
        fastcgi_param PHP_VALUE "upload_max_filesize=5M
post_max_size=6M";
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
