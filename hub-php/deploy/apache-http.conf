# Plain HTTP for hub.coilbox.org. Apache holds port 80 on this droplet, Nginx
# serves HTTPS. Every request is sent permanently to the same path on HTTPS,
# except certbot's renewal checks, which it answers from /var/www/html.
#
# Install as /etc/apache2/sites-available/hub.coilbox.org.conf, then
# `a2enmod rewrite`, `a2ensite hub.coilbox.org` and reload Apache.

<VirtualHost *:80>
    ServerName hub.coilbox.org
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://hub.coilbox.org%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/hub.coilbox.org-error.log
    CustomLog ${APACHE_LOG_DIR}/hub.coilbox.org-access.log combined
</VirtualHost>
